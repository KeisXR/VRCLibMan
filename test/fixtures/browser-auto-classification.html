<!doctype html><html lang="ja"><head><meta charset="UTF-8"><title>取得商品の分類テスト</title></head><body><div id="root"></div>
<script type="module">
import React, { useEffect, useState } from 'react';
import { createRoot } from 'react-dom/client';
import { ShellProvider } from '/src/App.tsx';
import { BrowserAutoClassification } from '/src/components/BrowserAutoClassification.tsx';
import { api } from '/src/api.ts';
import '/src/styles.css';
const fixture = window.autoFixture = {
  ready: false,
  error: null,
  pending: [{boothId:'123456', title:'見本の衣装'}, {boothId:'234567', title:'見本のワールド'}],
  saved: [],
  savedAvatars: [],
  failNext: false,
  holdSave: false,
  releaseSave: () => {},
  bump: () => {},
  fetches: 0,
};
api.browserAutoPending = async () => { fixture.fetches += 1; return fixture.pending.slice(); };

api.productAvatarSuggestions = async () => ({avatarIds:['lime'],unresolvedNames:[]});

  if (fixture.failNext) { fixture.failNext = false; throw new Error('保存失敗の見本'); }
  if (fixture.holdSave) await new Promise(resolve => { fixture.releaseSave = resolve; });
  fixture.saved.push({id, kind, genre});

};
api.browserAutoFinish = async id => { fixture.pending = fixture.pending.filter(item => item.boothId !== id); };
function Harness() {

    fixture.bump = () => setRevision(value => value + 1);
    fixture.ready = true;
  }, []);
  const shell = {
    revision,
    refresh: () => setRevision(value => value + 1),
    notify: () => {},

    builtinBrowser: true,
    refreshAccount: () => {},
    workInProgress: false,
  };
  return React.createElement(ShellProvider, { value: shell }, React.createElement(BrowserAutoClassification));
}
createRoot(document.getElementById('root')).render(React.createElement(React.StrictMode, null, React.createElement(Harness)));
</script></body></html>
