<!doctype html><html lang="ja"><head><meta charset="UTF-8"><title>取得商品の分類テスト</title></head><body><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { ShellProvider } from '/src/App.tsx';
import { BrowserAutoClassification } from '/src/components/BrowserAutoClassification.tsx';
import { api } from '/src/api.ts';
import '/src/styles.css';
const fixture = window.autoFixture = { ready: false, error: null, pending: [{boothId:'123456',title:'見本の衣装'}, {boothId:'234567',title:'見本のワールド'}], saved:[], failNext:false };
api.browserAutoPending = async () => fixture.pending;
api.moveProductGenre = async (id, kind, genre) => {
  if (fixture.failNext) { fixture.failNext=false; throw new Error('保存失敗の見本'); }
  fixture.saved.push({id,kind,genre});
};
api.browserAutoFinish = async id => { fixture.pending = fixture.pending.filter(item => item.boothId !== id); };
const shell = { revision:0, refresh:()=>{}, notify:()=>{}, fail: message => { fixture.lastError=message; }, builtinBrowser:true, refreshAccount:()=>{}, workInProgress:false };
createRoot(document.getElementById('root')).render(React.createElement(React.StrictMode, null, React.createElement(ShellProvider, {value:shell}, React.createElement(BrowserAutoClassification))));
fixture.ready=true;
</script></body></html>
