[package]
name = "tauri-app"
version = "0.2.3"
description = "Local organizer for VRChat and Booth assets you already own"
authors = ["VRCLibMan"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tiny_http = "0.12"
tempfile = "3.27"
# deep-link 2.6.2 builds a rust-ini 0.21 ParseOption literal. 0.21.3 added fields.
rust-ini = "=0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "stream"] }
walkdir = "2.5.0"
# Already used by walkdir. Detect hard links and aliases before a manual copy.
same-file = "1.0.6"
regex = "1.13.1"
unicode-normalization = "0.1.26"
url = "2.5.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Already in the tree through tauri and reqwest. Used for the cloud classifier semaphore and 429 backoff.
tokio = { version = "1", features = ["sync", "time"] }
# File tab: list zip entries from the central directory. "Unityで開く" also inflates the chosen
# .unitypackage entries, so only Deflate is enabled, through flate2 + zlib-rs which are already
# in the tree (reqwest, tauri). No other compression methods or crates come in.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Zip entry names without the UTF-8 flag are usually Shift_JIS on Japanese Windows.
encoding_rs = "0.8"

# Cloud classifier API key: Windows Credential Manager / macOS Keychain only.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6"
webkit2gtk = "2.0"
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString"] }
