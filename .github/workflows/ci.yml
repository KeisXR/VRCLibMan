name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-browser-panel:
    name: native macOS browser panel
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: test native macOS browser panel
        run: |
          rustc test/fixtures/macos-panel-frame.rs -o "$RUNNER_TEMP/macos-panel-frame"
          swift test/macos-browser-panel-layout.swift "$RUNNER_TEMP/macos-panel-frame"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: type check
        run: npx tsc --noEmit

      - name: test
        run: npm test
        
      # Drives real pointer input in headless Chrome (preinstalled on ubuntu-latest).
      # CHROME_PATH is pinned so a missing Chrome fails instead of skipping the test.
      - name: test right panel tab click
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:tab-click

  rust:
    name: rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - macos-latest
          - ubuntu-22.04
          - ubuntu-22.04-arm
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl wget file libwebkit2gtk-4.1-dev webkit2gtk-driver libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb xauth dbus xdotool

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      # generate_context! embeds frontendDist, so it must exist before Rust is compiled.
      - name: build frontend
        run: npm ci && npm run build

      - name: test browser panel layout
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: xvfb-run -a -s '-screen 0 2000x1200x24' npm run test:browser-layout

      - uses: dtolnay/rust-toolchain@stable

      # Use the LLD binary shipped with rustc for faster Windows test links.
      # Keep this CI-only: local Windows builds retain their default linker.
      - name: use bundled LLD linker on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lld = Join-Path (rustc --print sysroot).Trim() 'lib\rustlib\x86_64-pc-windows-msvc\bin\rust-lld.exe'
          if (-not (Test-Path -LiteralPath $lld)) { throw "Rust LLD linker not found: $lld" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$lld" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ runner.arch }}

      - name: test Rust library
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --lib

      - name: test Rust library
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: xvfb-run -a cargo test --lib --features tauri/custom-protocol

      - name: test native Linux browser panel
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: |
          native_root="$(mktemp -d)"
          trap 'rm -rf "$native_root"' EXIT
          for native_scale in 1 2; do
            native_case="$native_root/scale-$native_scale"
            mkdir -p "$native_case"/{data,config,cache,run}
            chmod 700 "$native_case/run"
            xvfb-run -a -s '-screen 0 3800x2400x24' dbus-run-session -- env \
              GDK_SCALE="$native_scale" VRCLIBMAN_NATIVE_TEST_DIR="$native_case" \
              XDG_DATA_HOME="$native_case/data" XDG_CONFIG_HOME="$native_case/config" \
              XDG_CACHE_HOME="$native_case/cache" XDG_RUNTIME_DIR="$native_case/run" \
              cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
                --features tauri/custom-protocol linux_browser_panel_native -- --ignored --test-threads=1
          done

      - name: test Rust library
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo test --lib
