name: release

# Windows NSIS and Apple Silicon dmg. Intel and universal macOS builds are not produced.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      - name: require the tag to match the app version
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8")).version;
          const tauri = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargo = readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
          const tag = process.env.GITHUB_REF_NAME;
          if (pkg !== tauri || pkg !== cargo) {
            console.error(`versions differ: package.json ${pkg}, tauri.conf.json ${tauri}, Cargo.toml ${cargo}`);
            process.exit(1);
          }
          if (tag !== `v${pkg}`) {
            console.error(`tag ${tag} must be v${pkg}`);
            process.exit(1);
          }
          EOF

      - name: package the Chrome extension
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "vrclibman-booth-export"
          node scripts/stage-extension.mjs --dest "$stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-artifacts | Out-Null
          $dest = Join-Path (Get-Location) "dist-artifacts/vrclibman-booth-export-$version.zip"
          if (Test-Path $dest) { Remove-Item $dest }
          Push-Location $stage
          try {
            Compress-Archive -Path * -DestinationPath $dest
          } finally {
            Pop-Location
          }

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: VRCLibMan v__VERSION__
          releaseBody: |
            Windows 用の未署名 NSIS インストーラです。SmartScreen が「Windows によって PC が保護されました」と出すことがあります。
            「詳細情報」から「実行」を選んでください。
            Mac は Apple Silicon と macOS 14 以降向けの未署名 dmg です。署名も公証もしていません。
            開けないときは、システム設定の「プライバシーとセキュリティ」で「このまま開く」を選ぶか、`xattr -dr com.apple.quarantine` をその .app に実行してください。
            `vrclibman://` は、.app を /Applications に置いたときだけ動きます。
            拡張は vrclibman-booth-export-*.zip です。展開したフォルダ（直下に manifest.json）を、Chrome の「パッケージ化されていない拡張機能」として読み込みます。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      - name: upload the extension zip
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          RELEASE_UPLOAD_URL: ${{ steps.tauri.outputs.releaseUploadUrl }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_ID}" ] || [ -z "${RELEASE_UPLOAD_URL}" ]; then
            echo "tauri-action did not return a draft release id"
            exit 1
          fi
          zip=$(echo dist-artifacts/*.zip)
          if [ ! -f "${zip}" ]; then
            echo "extension zip was not produced"
            exit 1
          fi
          name=$(basename "${zip}")
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name==\"${name}\") | .id")
          while IFS= read -r asset_id; do
            if [ -n "${asset_id}" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done <<< "${existing}"
          upload="${RELEASE_UPLOAD_URL%%\{*}"
          http=$(curl -sS -o /tmp/vrclibman-asset.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/zip" \
            --data-binary @"${zip}" \
            "${upload}?name=${name}")
          if [ "${http}" -lt 200 ] || [ "${http}" -ge 300 ]; then
            echo "extension upload failed with HTTP ${http}"
            cat /tmp/vrclibman-asset.json
            exit 1
          fi
