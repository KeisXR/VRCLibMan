<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>VRCLibMan</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="icons/icon-32.png" alt="" width="22" height="22" />
      <span class="name">VRCLibMan</span>
      <span id="link-chip" class="chip">確認中</span>
      <span class="grow"></span>
      <button id="open-panel" class="iconbtn" type="button" aria-label="サイドパネルを開く" title="サイドパネルを開く"></button>
      <button id="open-settings" class="iconbtn" type="button" aria-label="設定" title="設定"></button>
    </header>
    <main id="main" class="body"></main>
    <footer id="footer" class="foot">
      <label class="row grow">
        <input id="route-downloads" class="switch" type="checkbox" />
        <span>ダウンロードを自動整理</span>
      </label>
      <button id="pending" class="btn link num" type="button" hidden>未送信 <span id="pending-count">0</span> 件</button>
    </footer>
    <script src="shared.js"></script>
    <script src="companion.js"></script>
    <script src="ui.js"></script>
    <script src="pagecards.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
